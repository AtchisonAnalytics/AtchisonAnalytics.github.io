
                                                        <!DOCTYPE html>
                                                        <html lang="en">
                                                        <head>
                                                            <meta charset="UTF-8">
                                                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                            <title>Performance Table</title>
                                                            <style>
                                                                /* Add CSS style for table */
                                                                table.dataframe {
                                                                    border-collapse: collapse;
                                                                    width: 100%;
                                                                    max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                    border-radius: 10px; /* Adjust the border radius as needed */
                                                                    overflow: hidden; /* Ensure the border-radius is applied */
                                                                }

                                                                table.dataframe th,
                                                                table.dataframe td {
                                                                    border: none;
                                                                    padding: 8px; /* Adjust padding as needed */
                                                                    text-align: center; /* Adjust text alignment as needed */
                                                                }

                                                                table.dataframe th {
                                                                    background-color: #3D555E; /* Optional: Add background color for header */
                                                                    color: #E7EAEB;
                                                                }

                                                                /* Add CSS rule for hover effect */
                                                                tr:hover {
                                                                    background-color: #1DC8F2;
                                                                }
                                                            </style>
                                                        </head>
                                                        <body>
                                                            <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>2 Years (p.a.)</th>
      <th>Since Inception (p.a.)</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>AtchisonAlts</th>
      <td>2.90</td>
      <td>4.79</td>
      <td>9.30</td>
      <td>10.79</td>
      <td>8.24</td>
    </tr>
    <tr>
      <th>Peer Group</th>
      <td>0.96</td>
      <td>4.33</td>
      <td>4.20</td>
      <td>6.37</td>
      <td>6.24</td>
    </tr>
    <tr>
      <th>Inflation</th>
      <td>2.52</td>
      <td>2.33</td>
      <td>3.79</td>
      <td>3.02</td>
      <td>3.16</td>
    </tr>
    <tr>
      <th>Outperformance vs Peers</th>
      <td>1.94</td>
      <td>0.45</td>
      <td>5.10</td>
      <td>4.42</td>
      <td>2.00</td>
    </tr>
    <tr>
      <th>Outperformance vs Inflation</th>
      <td>0.38</td>
      <td>2.46</td>
      <td>5.51</td>
      <td>7.77</td>
      <td>5.09</td>
    </tr>
  </tbody>
</table>
                                                        </body>
                                                        </html>
